[tool.poetry]
name = "homework-part-2"
version = "0.1.0"
description = ""
authors = ["Mikhail Byrdukovsky <burmspb@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
python-dotenv = "^1.2.1"
requests = "^2.32.5"
pandas = "^3.0.1"
openpyxl = "^3.1.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=7.0.0,<8.0.0)",
]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.run
)/
'''

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.run
)/
'''

[tool.isort]
line_length = 119